<!DOCTYPE html>
<html>
<head>
    <title>Hyperlinks Example</title>
</head>
<body>
    <h1>Hyperlinks</h1>
    <p><a href="https://www.google.com" target="_blank">Visit Google</a></p>
    <p><a href="https://www.wikipedia.org" target="_self">Visit Wikipedia</a></p>
    <p><a href="https://www.github.com" target="_parent">Visit GitHub</a></p>
    <p><a href="https://www.stackoverflow.com" target="_top">Visit Stack Overflow</a></p>
</body>
</html>
