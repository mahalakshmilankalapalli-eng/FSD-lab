<!DOCTYPE html>
<html>
<head>
    <title>Q5a - Color References</title>
    <style>
        .name {
            color: red;
        }
        .hex {
            color: #00FF00;
        }
        .rgb {
            color: rgb(0, 0, 255);
        }
        .rgba {
            color: rgba(255, 0, 0, 0.5);
        }
        .hsl {
            color: hsl(120, 100%, 25%);
        }
        .hsla {
            color: hsla(240, 100%, 50%, 0.6);
        }
    </style>
</head>
<body>

    <h2 class="name">Color Name</h2>
    <h2 class="hex">Hex Color</h2>
    <h2 class="rgb">RGB Color</h2>
    <h2 class="rgba">RGBA Color</h2>
    <h2 class="hsl">HSL Color</h2>
    <h2 class="hsla">HSLA Color</h2>

</body>
</html>
