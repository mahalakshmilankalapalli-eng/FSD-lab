<!DOCTYPE html>
<html>
<head>
    <title>Q5c - Font and Text</title>
    <style>
        .font-size {
            font-size: 24px;
        }

        .font-weight {
            font-weight: bold;
        }

        .font-style {
            font-style: italic;
        }

        .text-decoration {
            text-decoration: underline;
        }

        .text-transform {
            text-transform: uppercase;
        }

        .text-align {
            text-align: center;
        }
    </style>
</head>
<body>

    <p class="font-size">Font size 24px</p>
    <p class="font-weight">Bold text</p>
    <p class="font-style">Italic text</p>
    <p class="text-decoration">Underlined text</p>
    <p class="text-transform">this text is uppercase</p>
    <p class="text-align">This text is center aligned</p>

</body>
</html>
