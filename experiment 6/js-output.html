<!DOCTYPE html>
<html>
<head>
    <title>Q6b - JS Output</title>
</head>
<body>

    <h2>JavaScript Output Methods</h2>

    <div id="outputDiv"></div>

    <script>
        alert("Output using alert()");
        document.write("Output using document.write()<br>");
        document.getElementById("outputDiv").innerHTML = "Output using innerHTML";
        console.log("Output using console.log()");
    </script>

</body>
</html>
