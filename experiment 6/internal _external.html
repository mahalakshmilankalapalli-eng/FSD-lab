<!DOCTYPE html>
<html>
<head>
    <title>Q6a - JS Internal and External</title>
    <script>
        function internalScript() {
            alert("This is internal JavaScript");
        }

        function externalScript() {
            alert("This is external JavaScript (simulated internally)");
        }
    </script>
</head>
<body>
    <h2>JavaScript Internal & External Example (Simulated)</h2>
    <button onclick="internalScript()">Run Internal JS</button>
    <button onclick="externalScript()">Run External JS</button>
</body>
</html>
