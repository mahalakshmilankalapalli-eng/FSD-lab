<!DOCTYPE html>
<html>
<head>
    <title>Q7f - RegExp Object</title>
</head>
<body>

    <h2>RegExp Object Example</h2>

    <script>
        let str = "The rain in Spain stays mainly in the plain.";
        let pattern = /ain/g;
        let matches = str.match(pattern);
        document.write("Found " + matches.length + " matches: " + matches.join(", "));
    </script>

</body>
</html>
