<!DOCTYPE html>
<html>
<head>
    <title>Q7d - Math Object</title>
</head>
<body>

    <h2>Math Object Example</h2>

    <script>
        document.write("PI: " + Math.PI + "<br>");
        document.write("Random (0–1): " + Math.random() + "<br>");
        document.write("Square Root of 64: " + Math.sqrt(64) + "<br>");
        document.write("2^3 = " + Math.pow(2, 3));
    </script>

</body>
</html>
