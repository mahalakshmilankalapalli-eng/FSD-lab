<!DOCTYPE html>
<html>
<head>
    <title>Q7e - String Object</title>
</head>
<body>

    <h2>String Object Example</h2>

    <script>
        let str = "JavaScript is Powerful!";
        document.write("Original: " + str + "<br>");
        document.write("Length: " + str.length + "<br>");
        document.write("Uppercase: " + str.toUpperCase() + "<br>");
        document.write("Includes 'Power': " + str.includes("Power"));
    </script>

</body>
</html>
