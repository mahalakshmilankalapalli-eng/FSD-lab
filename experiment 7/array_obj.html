<!DOCTYPE html>
<html>
<head>
    <title>Q7c - Array Object</title>
</head>
<body>

    <h2>Array Object Example</h2>

    <script>
        let fruits = ["Apple", "Banana", "Mango"];
        fruits.push("Orange");
        fruits.sort();
        document.write("Fruits: " + fruits.join(", ") + "<br>");
        document.write("Total Fruits: " + fruits.length);
    </script>

</body>
</html>
