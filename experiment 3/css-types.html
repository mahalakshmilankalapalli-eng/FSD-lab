<!DOCTYPE html>
<html>
<head>
    <title>Q3c - Types of CSS</title>

    <!-- Internal CSS -->
    <style>
        h1 {
            color: darkgreen;
            font-family: Arial;
        }

        p.internal {
            color: darkblue;
            font-size: 16px;
        }

        /* External CSS simulation below */
        div.external-style {
            background-color: lightyellow;
            border: 1px solid #ccc;
            padding: 10px;
        }
    </style>
</head>
<body>

<!-- Inline CSS -->
<h1 style="color:red;">This is a heading with Inline CSS</h1>

<!-- Internal CSS -->
<p class="internal">This paragraph uses Internal CSS.</p>

<!-- Simulated External CSS -->
<div class="external-style">
    This div simulates External CSS (normally linked via an external stylesheet).
</div>

</body>
</html>
