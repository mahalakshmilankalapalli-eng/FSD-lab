<!DOCTYPE html>
<html>
<head>
    <title>Q9c - Registration Form Validation</title>
</head>
<body>
    <h2>Registration Form</h2>
    <form onsubmit="return validateForm()">
        Name: <input type="text" id="name"><br><br>
        Mobile: <input type="text" id="mobile"><br><br>
        Email: <input type="text" id="email"><br><br>
        <input type="submit" value="Register">
    </form>
    <p id="error" style="color:red;"></p>

    <script>
        function validateForm() {
            let name = document.getElementById("name").value;
            let mobile = document.getElementById("mobile").value;
            let email = document.getElementById("email").value;

            let nameRegex = /^[A-Za-z][A-Za-z0-9]{5,}$/;
            let mobileRegex = /^[0-9]{10}$/;
            let emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

            if (!nameRegex.test(name)) {
                document.getElementById("error").innerText = "Invalid Name: Must start with a letter, alphanumeric, min 6 chars.";
                return false;
            }

            if (!mobileRegex.test(mobile)) {
                document.getElementById("error").innerText = "Invalid Mobile: Must be 10 digits.";
                return false;
            }

            if (!emailRegex.test(email)) {
                document.getElementById("error").innerText = "Invalid Email format.";
                return false;
            }

            document.getElementById("error").innerText = "";
            alert("Registration Successful!");
            return true;
        }
    </script>
</body>
</html>
