<!DOCTYPE html>
<html>
<head>
    <title>Q2d - Single File Frames</title>
    <style>
        body {
            margin: 0;
            display: flex;
            height: 100vh;
        }
        iframe {
            width: 33.33%;
            border: 1px solid black;
        }
    </style>
</head>
<body>
    <iframe srcdoc='
        <!DOCTYPE html>
        <html>
        <body style="margin:0; padding:0;">
            <img src="https://via.placeholder.com/300x400" width="100%" height="100%">
        </body>
        </html>
    '>
    </iframe>

    <iframe srcdoc='
        <!DOCTYPE html>
        <html>
        <body style="padding:20px; font-family:Arial;">
            <h2>Paragraph Frame</h2>
            <p>This is a sample paragraph displayed inside the middle frame. You can write any content here to explain the use of frames.</p>
        </body>
        </html>
    '>
    </iframe>

    <iframe srcdoc='
        <!DOCTYPE html>
        <html>
        <body style="padding:20px; font-family:Arial;">
            <h2>Hyperlink Frame</h2>
            <p><a href="https://www.example.com" target="_blank">Click here to visit Example.com</a></p>
        </body>
        </html>
    '>
    </iframe>
</body>
</html>
